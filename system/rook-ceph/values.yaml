rook-ceph:
  monitoring:
    enabled: true
  # Match the SA names created by the older ceph-csi-operator v0.4.0 chart so the
  # upgrade to rook 1.20 (operator v1.0.1, which defaults the prefix to "") does
  # not orphan the existing RBAC / break PVC mounts.
  ceph-csi-operator:
    controllerManager:
      manager:
        env:
          csiServiceAccountPrefix: "ceph-csi-"
rook-ceph-cluster:
  monitoring:
    enabled: true
    createPrometheusRules: true
  cephClusterSpec:
    cephVersion:
      image: quay.io/ceph/ceph:v20.2.4
      imagePullPolicy: IfNotPresent
    cephConfig:
      global:
        mon_data_avail_warn: "15"
      osd:
        bluestore_slow_ops_warn_threshold: "15"
    # Ceph Tentacle added the aes256k cephx cipher and health checks that flag
    # the legacy "aes" keys. Rotation only happens when keyRotationPolicy is
    # enabled; bumping keyGeneration above the current value is what triggers it.
    # Generations only ever move forward -- undoing a rotation means another
    # bump, not restoring the previous value.
    security:
      cephx:
        daemon:
          keyType: aes256k
          keyRotationPolicy: KeyGeneration
          # Generation 2, not 1: the mds keys were already created at
          # generation 1 back under Ceph 19.2.3, so generation 1 was a no-op
          # for them and they stayed on aes while every other daemon rotated.
          keyGeneration: 2
        csi:
          # Stays on aes. Kernel 7.1 on metal0 handles aes256k, but ceph-csi
          # v3.17.0 links a librados that does not: rotating csi to aes256k
          # made every provision fail with "rados: ret=-22, Invalid argument".
          # Generation 2 rotates the aes256k keys from generation 1 back to aes.
          keyType: aes
          keyRotationPolicy: KeyGeneration
          keyGeneration: 2
          # Keep the superseded key valid so mounted PVs survive the rotation.
          keepPriorKeyCountMax: 1
    mon:
      count: 1
    mgr:
      count: 1
    dashboard:
      ssl: false
    logCollector:
      enabled: false
    removeOSDsIfOutAndSafeToRemove: true
    resources:
      osd:
        limits:
          memory: 4Gi  # rule of thumb for ceph osd memory: 1Gi per 1TB of storage
        requests:
          memory: 4Gi
  cephBlockPools:
    - name: builtin-mgr
      spec:
        name: .mgr
        failureDomain: osd
        replicated:
          size: 2
      storageClass:
        enabled: false
    - name: standard-rwo
      spec:
        failureDomain: osd
        replicated:
          size: 2
      storageClass:
        enabled: true
        name: standard-rwo
        isDefault: true
        allowVolumeExpansion: true
        parameters:
          imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
          csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
  cephBlockPoolsVolumeSnapshotClass:
    enabled: true
    isDefault: true
  cephFileSystems:
    - name: standard-rwx
      spec:
        metadataPool:
          failureDomain: osd
          replicated:
            size: 2
        dataPools:
          - name: data0
            failureDomain: osd
            replicated:
              size: 2
        metadataServer:
          activeCount: 1
          activeStandby: true
          priorityClassName: system-cluster-critical
      storageClass:
        enabled: true
        name: standard-rwx
        isDefault: false
        allowVolumeExpansion: true
        pool: data0
        parameters:
          csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
          csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
          csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
          csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
  cephFileSystemVolumeSnapshotClass:
    enabled: true
    isDefault: false
  cephObjectStores: []
