# Overlay applied on top of values.yaml on the very first install only, when
# kube-prometheus-stack (and therefore the ServiceMonitor CRD) does not exist
# yet. Keep this file limited to those toggles — everything else is inherited.
argo-cd:
  server:
    metrics: &metrics
      enabled: false
      serviceMonitor:
        enabled: false
  controller:
    metrics: *metrics
  repoServer:
    metrics: *metrics
  redis:
    metrics: *metrics
