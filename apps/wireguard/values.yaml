app-template:
  controllers:
    wireguard:
      initContainers:
        # Pod netns starts with forwarding disabled; wg0 <-> eth0 routing needs it.
        sysctl:
          image:
            repository: busybox
            tag: "1.38.0"
          command: ["sysctl", "-w", "net.ipv4.ip_forward=1"]
          securityContext:
            privileged: true
      containers:
        app:
          image:
            repository: linuxserver/wireguard
            tag: 1.0.20260223-r0-ls118
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 64Mi
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                exec:
                  command: ["wg", "show", "wg0"]
                periodSeconds: 30
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                exec:
                  command: ["wg", "show", "wg0"]
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                exec:
                  command: ["wg", "show", "wg0"]
                periodSeconds: 5
                failureThreshold: 12
  service:
    app:
      controller: wireguard
      type: LoadBalancer
      annotations:
        lbipam.cilium.io/ips: "192.168.1.6"
      externalTrafficPolicy: Local
      ports:
        wireguard:
          port: 51820
          protocol: UDP
  persistence:
    config:
      type: secret
      name: wireguard-config
      globalMounts:
        - path: /config/wg_confs/wg0.conf
          subPath: wg0.conf

# Peer public keys are not secret; the server private key comes from
# the external secret (see templates/secret.yaml and external/terraform.tfvars).
# allowedIPs must match the Address of the peer's Proton identity config,
# see scripts/wireguard-phone-config.
peers:
  - name: phone
    publicKey: g4BdJEBPjKrN6n+TeRDAI8wPtSTcmsTgnN6uRDcWcAk=
    allowedIPs: 10.2.0.2/32
