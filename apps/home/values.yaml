# Devices to register in Home Assistant (synced by device-sync job)
shelly:
  devices:
    - 192.168.1.38
    - 192.168.1.74
    - 192.168.1.79
    - 192.168.1.84
    - 192.168.1.91
    - 192.168.1.90

# ESPHome devices; API encryption key expected in the home.esphome
# secret (global-secrets namespace) under the device name
esphome:
  devices:
    - name: ifan04
      host: 192.168.1.82
    - name: slzb06p10
      host: 192.168.1.111
    - name: powermeter
      host: 192.168.1.48
    - name: blinds-controller
      host: 192.168.1.21

# Wyoming voice services (synced by device-sync job). title is the config
# entry title HA assigns (= wyoming program name); the sync job uses it to
# detect existing entries, so don't rename them in the UI
wyoming:
  services:
    - name: whisper
      host: home-whisper
      port: 10300
      title: faster-whisper
    - name: piper
      host: home-piper
      port: 10200
      title: piper

# Matter server the matter integration connects to (synced by device-sync job).
# Resolves to the node IP since the matter controller runs on the host network
matter:
  url: ws://home-matter:5580/ws

home-assistant:
  env:
    - name: TZ
      value: Europe/Berlin

  # Sat at 470-490Mi with a 500Mi limit; loading the matter integration tipped
  # it into OOMKill
  resources:
    requests:
      memory: 768Mi
    limits:
      memory: 768Mi

  service:
    type: ClusterIP
    port: 8123

  ingress:
    enabled: false

  # Enables the prometheus integration in configuration.yaml and creates a
  # ServiceMonitor scraping /api/prometheus, reusing the gitops API token
  serviceMonitor:
    enabled: true
    bearerToken:
      secretName: home-assistant-gitops
      secretKey: token

  configuration:
    enabled: true
    forceInit: true
    # Overrides the chart default for two reasons:
    #  - No document-leading comment. forceInit deep-merges this into
    #    /config/configuration.yaml on every start, and yq appends a leading
    #    comment on each merge (it had accumulated 74 copies). Comments attached
    #    to a key are deduplicated by the merge and are safe.
    #  - No http: block. HA 2027.2.0 drops http: from YAML; the settings were
    #    imported into .storage/http (Settings > System > Network) and are now
    #    UI-managed. The chart only emits http: when its own ingress/httpRoute is
    #    enabled, which it is not here (see templates/httproute.yaml), so the
    #    block in the PVC was a stale leftover -- the merge can add keys but
    #    never remove them.
    # prometheus: is hardcoded rather than keyed off serviceMonitor.enabled
    # (upstream does that) because the merge could not remove it again anyway.
    templateConfig: |-
      default_config:
      prometheus:
      # Load frontend themes from the themes folder
      frontend:
        themes: !include_dir_merge_named themes

      automation: !include automations.yaml
      script: !include scripts.yaml
      scene: !include scenes.yaml

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi

# Wyoming speech services for the Assist pipeline (whisper STT, piper TTS) and
# the Matter controller HA's matter integration talks to
app-template:
  controllers:
    # Matter is IPv6 link-local multicast + mDNS, so the controller must sit on
    # the LAN itself, not in the pod network
    matter:
      pod:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        securityContext:
          fsGroup: 1000
      containers:
        app:
          image:
            repository: ghcr.io/matter-js/matterjs-server
            tag: "1.5.2"
          env:
            TZ: Europe/Berlin
            PRIMARY_INTERFACE: eno1
            NODE_OPTIONS: --max-old-space-size=384
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 30
                periodSeconds: 5
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 512Mi
    whisper:
      containers:
        app:
          image:
            repository: docker.io/rhasspy/wyoming-whisper
            tag: 3.8.1
          # base-int8: ~1s per command on the Ryzen 2600 vs 8-10s for
          # medium-int8 (benchmarked); beam 5 costs nothing at this size
          args:
            - --model
            - base-int8
            - --language
            - de
            - --beam-size
            - "5"
            - --cpu-threads
            - "10"
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 120
                periodSeconds: 5
          resources:
            requests:
              memory: 768Mi
            limits:
              memory: 768Mi
    piper:
      containers:
        app:
          image:
            repository: docker.io/rhasspy/wyoming-piper
            tag: 2.5.2
          args:
            - --voice
            - de_DE-thorsten-medium
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 60
                periodSeconds: 5
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 512Mi

  service:
    matter:
      controller: matter
      ports:
        ws:
          port: 5580
    whisper:
      controller: whisper
      ports:
        wyoming:
          port: 10300
    piper:
      controller: piper
      ports:
        wyoming:
          port: 10200

  persistence:
    # Fabric credentials; losing this means factory-resetting and
    # re-commissioning every Matter device. In the Makefile backup list.
    matter-data:
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        matter:
          app:
            - path: /data
    # Model caches; models are re-downloaded if lost, no backup needed
    whisper-data:
      accessMode: ReadWriteOnce
      size: 4Gi
      advancedMounts:
        whisper:
          app:
            - path: /data
    piper-data:
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        piper:
          app:
            - path: /data
