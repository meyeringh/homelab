# Devices to register in Home Assistant (synced by device-sync job)
shelly:
  devices:
    - 192.168.1.38
    - 192.168.1.44

# ESPHome devices; API encryption key expected in the home.esphome
# secret (global-secrets namespace) under the device name
esphome:
  devices:
    - name: ifan04
      host: 192.168.1.82
    - name: slzb06p10
      host: 192.168.1.111
    - name: powermeter
      host: 192.168.1.48

# Wyoming voice services (synced by device-sync job)
wyoming:
  services:
    - name: whisper
      host: home-whisper
      port: 10300
    - name: piper
      host: home-piper
      port: 10200

home-assistant:
  env:
    - name: TZ
      value: Europe/Berlin

  resources:
    requests:
      memory: 500Mi
    limits:
      memory: 500Mi

  service:
    type: ClusterIP
    port: 8123

  ingress:
    enabled: false

  # Enables the prometheus integration in configuration.yaml and creates a
  # ServiceMonitor scraping /api/prometheus, reusing the gitops API token
  serviceMonitor:
    enabled: true
    bearerToken:
      secretName: home-assistant-gitops
      secretKey: token

  configuration:
    enabled: true
    forceInit: true
    trusted_proxies:
      - 10.0.0.0/8

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 5Gi

# Wyoming speech services for the Assist pipeline: whisper (STT) + piper (TTS)
app-template:
  controllers:
    whisper:
      containers:
        app:
          image:
            repository: docker.io/rhasspy/wyoming-whisper
            tag: 3.5.0
          args:
            - --model
            - medium-int8
            - --language
            - de
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 120
                periodSeconds: 5
          resources:
            requests:
              memory: 3Gi
            limits:
              memory: 3Gi
    piper:
      containers:
        app:
          image:
            repository: docker.io/rhasspy/wyoming-piper
            tag: 2.3.1
          args:
            - --voice
            - de_DE-thorsten-medium
          probes:
            liveness:
              enabled: true
            readiness:
              enabled: true
            startup:
              enabled: true
              spec:
                failureThreshold: 60
                periodSeconds: 5
          resources:
            requests:
              memory: 512Mi
            limits:
              memory: 512Mi

  service:
    whisper:
      controller: whisper
      ports:
        wyoming:
          port: 10300
    piper:
      controller: piper
      ports:
        wyoming:
          port: 10200

  # Model caches; models are re-downloaded if lost, no backup needed
  persistence:
    whisper-data:
      accessMode: ReadWriteOnce
      size: 4Gi
      advancedMounts:
        whisper:
          app:
            - path: /data
    piper-data:
      accessMode: ReadWriteOnce
      size: 1Gi
      advancedMounts:
        piper:
          app:
            - path: /data
