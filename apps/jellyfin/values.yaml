app-template:
  defaultPodOptions:
    securityContext:
      fsGroup: 1000
  controllers:
    jellyfin:
      # every app in this pod keeps state in sqlite on one RWO volume, so the
      # old pod must be gone before the new one starts
      strategy: Recreate
      containers:
        jellyfin:
          image:
            repository: docker.io/jellyfin/jellyfin
            tag: 10.11.11
          resources:
            requests:
              memory: 2000Mi
            limits:
              memory: 2000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8096
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8096
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8096
                periodSeconds: 10
                failureThreshold: 30
        sabnzbd:
          image:
            repository: lscr.io/linuxserver/sabnzbd
            tag: 5.1.2
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              memory: 2000Mi
            limits:
              memory: 2000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                periodSeconds: 10
                failureThreshold: 30
        infinidysk:
          image:
            repository: ghcr.io/infinidysk/infinidysk
            tag: v1.2.5
          env:
            TZ: Europe/Berlin
            # 911 is the uid the linuxserver arr containers run as. Radarr
            # imports by copy-then-delete, and deleting needs write on the
            # SOURCE dir, which infinidysk creates 0755 -- so it has to own it.
            PUID: "911"
            PGID: "1000"
            # TLS is terminated at the gateway
            TRUST_PROXY: "1"
            SECURE_COOKIES: "true"
            # the backend defaults to :8080, which sabnzbd already owns in this
            # pod's shared network namespace -- without this the frontend proxies
            # /api straight into sabnzbd
            ASPNETCORE_URLS: http://127.0.0.1:3001
            BACKEND_URL: http://127.0.0.1:3001
            # STRM import instead of the default rclone symlinks: no FUSE, no
            # privileged container, and nothing has to be mount-propagated into
            # radarr/sonarr (which is impossible through subPath mounts anyway)
            NZBDAV_CONFIG__API__IMPORT_STRATEGY: strm
            NZBDAV_CONFIG__API__COMPLETED_DOWNLOADS_DIR: /data/completed-downloads
            NZBDAV_CONFIG__API__CATEGORIES: movies,tv
            # STAT every article before reporting the job complete. Off by
            # default, which let a release missing its last 14 MB import as
            # "completed" -- matroska keeps its seek index there, so no player
            # could start it. A failed check fails the grab and radarr moves on.
            NZBDAV_CONFIG__API__ENSURE_ARTICLE_EXISTENCE_CATEGORIES: movies,tv
            NZBDAV_CONFIG__API__ARTICLE_EXISTENCE_CHECK_MODE: full
            # lazy rar mounting parses only the FIRST volume and extrapolates
            # the inner file size across the set, overshooting when the last
            # volume is short: reads past the real end 404 and players that
            # need the matroska index at EOF hang. Parse every volume instead.
            NZBDAV_CONFIG__API__LAZY_RAR_PARSING: "false"
            # must be reachable by the CLIENT, not just by jellyfin: for remote
            # http sources jellyfin hands the .strm url straight to the player
            # for direct play, so a localhost url makes the phone dial itself
            NZBDAV_CONFIG__GENERAL__BASE_URL: https://infinidysk.meyeringh.org
            # keep the write-heavy decoded-segment cache off Ceph RBD
            NZBDAV_CONFIG__USENET__SEGMENT_CACHE__PATH: /cache/segments
            NZBDAV_CONFIG__USENET__SEGMENT_CACHE__MAX_GB: "8"
            NZBDAV_CONFIG__API__KEY:
              valueFrom:
                secretKeyRef:
                  name: infinidysk-api
                  key: apiKey
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              # the in-flight article budget is derived from this limit
              memory: 2000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 3000
                periodSeconds: 30
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 3000
                periodSeconds: 30
            # /healthz is served by the frontend alone and stays green even when
            # the backend is dead, so prove the proxy reaches the backend here.
            # mode=version is the one unauthenticated sab endpoint.
            startup:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: "/api?mode=version&output=json"
                  port: 3000
                periodSeconds: 10
                failureThreshold: 60
        prowlarr:
          image:
            repository: lscr.io/linuxserver/prowlarr
            tag: 2.5.2
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 1000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 9696
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 9696
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 9696
                periodSeconds: 10
                failureThreshold: 30
        radarr:
          image:
            repository: lscr.io/linuxserver/radarr
            tag: 6.3.0
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 1000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 7878
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 7878
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 7878
                periodSeconds: 10
                failureThreshold: 30
        sonarr:
          image:
            repository: lscr.io/linuxserver/sonarr
            tag: 4.0.19
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 1000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8989
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8989
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8989
                periodSeconds: 10
                failureThreshold: 30
        jellyseerr:
          image:
            repository: ghcr.io/seerr-team/seerr
            tag: v3.4.1
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 1000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 5055
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 5055
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 5055
                periodSeconds: 10
                failureThreshold: 30
        exportarr-radarr:
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0
          args:
            - radarr
          env:
            PORT: "9707"
            URL: http://localhost:7878
            # Reads ApiKey/Port/UrlBase out of Radarr's own config.xml, so the key
            # is never duplicated into git or the secret store
            CONFIG: /config/config.xml
            LOG_FORMAT: json
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9707
                periodSeconds: 30
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9707
                periodSeconds: 30
            startup:
              enabled: false
        exportarr-sonarr:
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0
          args:
            - sonarr
          env:
            PORT: "9708"
            URL: http://localhost:8989
            CONFIG: /config/config.xml
            LOG_FORMAT: json
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9708
                periodSeconds: 30
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9708
                periodSeconds: 30
            startup:
              enabled: false
        exportarr-prowlarr:
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0
          args:
            - prowlarr
          env:
            PORT: "9709"
            URL: http://localhost:9696
            CONFIG: /config/config.xml
            LOG_FORMAT: json
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9709
                periodSeconds: 30
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9709
                periodSeconds: 30
            startup:
              enabled: false
        exportarr-sabnzbd:
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0
          args:
            - sabnzbd
          env:
            PORT: "9710"
            URL: http://localhost:8080
            # sabnzbd.ini is not the XML format CONFIG understands, so the key is
            # extracted into an emptyDir by the sabnzbd-apikey init container
            API_KEY_FILE: /apikeys/sabnzbd
            LOG_FORMAT: json
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9710
                periodSeconds: 30
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9710
                periodSeconds: 30
            startup:
              enabled: false
      initContainers:
        # sabnzbd.ini is mode 0660 abc:abc, so this runs as root to read it
        sabnzbd-apikey:
          image:
            repository: docker.io/library/busybox
            tag: 1.38.0
          command:
            - /bin/sh
            - -c
            - >-
              sed -n 's/^api_key *= *//p' /sabnzbd-config/sabnzbd.ini
              | tr -d '\n' > /apikeys/sabnzbd
              && chmod 0444 /apikeys/sabnzbd
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
        # radarr/sonarr health-check the per-category output folder before
        # infinidysk has created it on its first job
        infinidysk-dirs:
          image:
            repository: docker.io/library/busybox
            tag: 1.38.0
          command:
            - /bin/sh
            - -c
            - >-
              mkdir -p /data/completed-downloads/movies
              /data/completed-downloads/tv
              && chown -R 911:1000 /data/completed-downloads
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
    # radarr/sonarr have no built-in periodic search: RssSync only ever sees
    # newly posted releases, so anything already on the indexer is never found
    # and cutoff upgrades never happen. This is the missing nudge.
    arr-search:
      type: cronjob
      cronjob:
        schedule: "0 5 * * 0"
        timeZone: Europe/Berlin
        concurrencyPolicy: Forbid
        successfulJobsHistory: 1
        failedJobsHistory: 3
        backoffLimit: 2
        ttlSecondsAfterFinished: 604800
      pod:
        restartPolicy: OnFailure
      containers:
        search:
          image:
            repository: docker.io/curlimages/curl
            tag: 8.21.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              H=jellyfin.jellyfin.svc.cluster.local
              R=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /radarr-config/config.xml)
              S=$(sed -n 's:.*<ApiKey>\(.*\)</ApiKey>.*:\1:p' /sonarr-config/config.xml)
              for c in MissingMoviesSearch CutoffUnmetMoviesSearch; do
                curl -fsS -o /dev/null -X POST "http://$H:7878/api/v3/command" \
                  -H "X-Api-Key: $R" -H 'Content-Type: application/json' \
                  -d "{\"name\":\"$c\"}"
                echo "radarr $c queued"
              done
              for c in MissingEpisodeSearch CutoffUnmetEpisodeSearch; do
                curl -fsS -o /dev/null -X POST "http://$H:8989/api/v3/command" \
                  -H "X-Api-Key: $S" -H 'Content-Type: application/json' \
                  -d "{\"name\":\"$c\"}"
                echo "sonarr $c queued"
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
  service:
    jellyfin:
      controller: jellyfin
      ports:
        http:
          port: 8096
          protocol: HTTP
        sabnzbd:
          port: 8080
          protocol: HTTP
        prowlarr:
          port: 9696
          protocol: HTTP
        radarr:
          port: 7878
          protocol: HTTP
        sonarr:
          port: 8989
          protocol: HTTP
        jellyseerr:
          port: 5055
          protocol: HTTP
        metrics-radarr:
          port: 9707
          protocol: HTTP
        metrics-sonarr:
          port: 9708
          protocol: HTTP
        metrics-prowlarr:
          port: 9709
          protocol: HTTP
        metrics-sabnzbd:
          port: 9710
          protocol: HTTP
        infinidysk:
          port: 3000
          protocol: HTTP
  serviceMonitor:
    exportarr:
      enabled: true
      service:
        identifier: jellyfin
      endpoints:
        - port: metrics-radarr
          path: /metrics
          interval: 1m
          scrapeTimeout: 30s
        - port: metrics-sonarr
          path: /metrics
          interval: 1m
          scrapeTimeout: 30s
        - port: metrics-prowlarr
          path: /metrics
          interval: 1m
          scrapeTimeout: 30s
        - port: metrics-sabnzbd
          path: /metrics
          interval: 1m
          scrapeTimeout: 30s
  ingress:
    jellyfin:
      enabled: false
    servarr:
      enabled: false

  route:
    jellyfin:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - media.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: http
    jellyseerr:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - requests.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: jellyseerr
    sabnzbd:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - sabnzbd.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: sabnzbd
    prowlarr:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - prowlarr.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: prowlarr
    radarr:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - radarr.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: radarr
    sonarr:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - sonarr.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: sonarr
    infinidysk:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - infinidysk.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: infinidysk
  persistence:
    data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 250Gi
      retain: true
      advancedMounts:
        jellyfin:
          jellyfin:
            - path: /config
              subPath: jellyfin/config
            - path: /media/movies
              subPath: movies
            - path: /media/shows
              subPath: shows
          sabnzbd:
            - path: /config
              subPath: sabnzbd/config
            - path: /downloads
              subPath: sabnzbd/downloads
          prowlarr:
            - path: /config
              subPath: prowlarr/config
          radarr:
            - path: /config
              subPath: radarr/config
            - path: /downloads/complete
              subPath: sabnzbd/downloads/complete
            - path: /data/completed-downloads
              subPath: infinidysk/completed-downloads
            - path: /movies
              subPath: movies
          sonarr:
            - path: /config
              subPath: sonarr/config
            - path: /downloads/complete
              subPath: sabnzbd/downloads/complete
            - path: /data/completed-downloads
              subPath: infinidysk/completed-downloads
            - path: /shows
              subPath: shows
          jellyseerr:
            - path: /app/config
              subPath: jellyseerr/config
          exportarr-radarr:
            - path: /config
              subPath: radarr/config
              readOnly: true
          exportarr-sonarr:
            - path: /config
              subPath: sonarr/config
              readOnly: true
          exportarr-prowlarr:
            - path: /config
              subPath: prowlarr/config
              readOnly: true
          sabnzbd-apikey:
            - path: /sabnzbd-config
              subPath: sabnzbd/config
              readOnly: true
          infinidysk-dirs:
            - path: /data/completed-downloads
              subPath: infinidysk/completed-downloads
          infinidysk:
            - path: /config
              subPath: infinidysk/config
            # the .strm files radarr/sonarr import from; the absolute path must
            # be identical in all three containers
            - path: /data/completed-downloads
              subPath: infinidysk/completed-downloads
        arr-search:
          search:
            - path: /radarr-config
              subPath: radarr/config
              readOnly: true
            - path: /sonarr-config
              subPath: sonarr/config
              readOnly: true
    apikeys:
      type: emptyDir
      advancedMounts:
        jellyfin:
          sabnzbd-apikey:
            - path: /apikeys
          exportarr-sabnzbd:
            - path: /apikeys
              readOnly: true
    segment-cache:
      type: emptyDir
      advancedMounts:
        jellyfin:
          infinidysk:
            - path: /cache
