app-template:
  defaultPodOptions:
    securityContext:
      fsGroup: 1000
  controllers:
    jellyfin:
      containers:
        jellyfin:
          image:
            repository: docker.io/jellyfin/jellyfin
            tag: 10.11.11
          resources:
            requests:
              memory: 2000Mi
            limits:
              memory: 2000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8096
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8096
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8096
                periodSeconds: 10
                failureThreshold: 30
        sabnzbd:
          image:
            repository: lscr.io/linuxserver/sabnzbd
            tag: 5.1.1
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              memory: 2000Mi
            limits:
              memory: 2000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8080
                periodSeconds: 10
                failureThreshold: 30
        prowlarr:
          image:
            repository: lscr.io/linuxserver/prowlarr
            tag: 2.5.2
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 1000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 9696
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 9696
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 9696
                periodSeconds: 10
                failureThreshold: 30
        radarr:
          image:
            repository: lscr.io/linuxserver/radarr
            tag: 6.3.0
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 1000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 7878
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 7878
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 7878
                periodSeconds: 10
                failureThreshold: 30
        sonarr:
          image:
            repository: lscr.io/linuxserver/sonarr
            tag: 4.0.19
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 1000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8989
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8989
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 8989
                periodSeconds: 10
                failureThreshold: 30
        jellyseerr:
          image:
            repository: ghcr.io/seerr-team/seerr
            tag: v3.4.1
          env:
            TZ: Europe/Berlin
          resources:
            requests:
              memory: 1000Mi
            limits:
              memory: 1000Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 5055
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 5055
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 5055
                periodSeconds: 10
                failureThreshold: 30
        exportarr-radarr:
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0
          args:
            - radarr
          env:
            PORT: "9707"
            URL: http://localhost:7878
            # Reads ApiKey/Port/UrlBase out of Radarr's own config.xml, so the key
            # is never duplicated into git or the secret store
            CONFIG: /config/config.xml
            LOG_FORMAT: json
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9707
                periodSeconds: 30
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9707
                periodSeconds: 30
            startup:
              enabled: false
        exportarr-sonarr:
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0
          args:
            - sonarr
          env:
            PORT: "9708"
            URL: http://localhost:8989
            CONFIG: /config/config.xml
            LOG_FORMAT: json
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9708
                periodSeconds: 30
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9708
                periodSeconds: 30
            startup:
              enabled: false
        exportarr-prowlarr:
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0
          args:
            - prowlarr
          env:
            PORT: "9709"
            URL: http://localhost:9696
            CONFIG: /config/config.xml
            LOG_FORMAT: json
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9709
                periodSeconds: 30
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9709
                periodSeconds: 30
            startup:
              enabled: false
        exportarr-sabnzbd:
          image:
            repository: ghcr.io/onedr0p/exportarr
            tag: v2.3.0
          args:
            - sabnzbd
          env:
            PORT: "9710"
            URL: http://localhost:8080
            # sabnzbd.ini is not the XML format CONFIG understands, so the key is
            # extracted into an emptyDir by the sabnzbd-apikey init container
            API_KEY_FILE: /apikeys/sabnzbd
            LOG_FORMAT: json
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9710
                periodSeconds: 30
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: 9710
                periodSeconds: 30
            startup:
              enabled: false
      initContainers:
        # sabnzbd.ini is mode 0660 abc:abc, so this runs as root to read it
        sabnzbd-apikey:
          image:
            repository: docker.io/library/busybox
            tag: 1.38.0
          command:
            - /bin/sh
            - -c
            - >-
              sed -n 's/^api_key *= *//p' /sabnzbd-config/sabnzbd.ini
              | tr -d '\n' > /apikeys/sabnzbd
              && chmod 0444 /apikeys/sabnzbd
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
  service:
    jellyfin:
      controller: jellyfin
      ports:
        http:
          port: 8096
          protocol: HTTP
        sabnzbd:
          port: 8080
          protocol: HTTP
        prowlarr:
          port: 9696
          protocol: HTTP
        radarr:
          port: 7878
          protocol: HTTP
        sonarr:
          port: 8989
          protocol: HTTP
        jellyseerr:
          port: 5055
          protocol: HTTP
        metrics-radarr:
          port: 9707
          protocol: HTTP
        metrics-sonarr:
          port: 9708
          protocol: HTTP
        metrics-prowlarr:
          port: 9709
          protocol: HTTP
        metrics-sabnzbd:
          port: 9710
          protocol: HTTP
  serviceMonitor:
    exportarr:
      enabled: true
      service:
        identifier: jellyfin
      endpoints:
        - port: metrics-radarr
          path: /metrics
          interval: 1m
          scrapeTimeout: 30s
        - port: metrics-sonarr
          path: /metrics
          interval: 1m
          scrapeTimeout: 30s
        - port: metrics-prowlarr
          path: /metrics
          interval: 1m
          scrapeTimeout: 30s
        - port: metrics-sabnzbd
          path: /metrics
          interval: 1m
          scrapeTimeout: 30s
  ingress:
    jellyfin:
      enabled: false
    servarr:
      enabled: false

  route:
    jellyfin:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - media.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: http
    jellyseerr:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - requests.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: jellyseerr
    sabnzbd:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - sabnzbd.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: sabnzbd
    prowlarr:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - prowlarr.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: prowlarr
    radarr:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - radarr.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: radarr
    sonarr:
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - sonarr.meyeringh.org
      rules:
        - backendRefs:
            - identifier: jellyfin
              port: sonarr
  persistence:
    data:
      enabled: true
      accessMode: ReadWriteOnce
      size: 100Gi
      retain: true
      advancedMounts:
        jellyfin:
          jellyfin:
            - path: /config
              subPath: jellyfin/config
            - path: /media/movies
              subPath: movies
            - path: /media/shows
              subPath: shows
          sabnzbd:
            - path: /config
              subPath: sabnzbd/config
            - path: /downloads
              subPath: sabnzbd/downloads
          prowlarr:
            - path: /config
              subPath: prowlarr/config
          radarr:
            - path: /config
              subPath: radarr/config
            - path: /downloads/complete
              subPath: sabnzbd/downloads/complete
            - path: /movies
              subPath: movies
          sonarr:
            - path: /config
              subPath: sonarr/config
            - path: /downloads/complete
              subPath: sabnzbd/downloads/complete
            - path: /shows
              subPath: shows
          jellyseerr:
            - path: /app/config
              subPath: jellyseerr/config
          exportarr-radarr:
            - path: /config
              subPath: radarr/config
              readOnly: true
          exportarr-sonarr:
            - path: /config
              subPath: sonarr/config
              readOnly: true
          exportarr-prowlarr:
            - path: /config
              subPath: prowlarr/config
              readOnly: true
          sabnzbd-apikey:
            - path: /sabnzbd-config
              subPath: sabnzbd/config
              readOnly: true
    apikeys:
      type: emptyDir
      advancedMounts:
        jellyfin:
          sabnzbd-apikey:
            - path: /apikeys
          exportarr-sabnzbd:
            - path: /apikeys
              readOnly: true
