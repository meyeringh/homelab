apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: infinidysk-api
  namespace: "{{ .Release.Namespace }}"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: infinidysk-api
  data:
    - secretKey: apiKey
      remoteRef:
        key: infinidysk.api
        property: apiKey
