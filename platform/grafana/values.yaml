grafana:
  resources:
    requests:
      memory: 264Mi
    limits:
      memory: 264Mi

  # Load dashboards from ConfigMaps labeled grafana_dashboard across all
  # namespaces (kube-prometheus-stack force-deploys its dashboards this way)
  sidecar:
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 100Mi
    dashboards:
      enabled: true
      searchNamespace: ALL
      label: grafana_dashboard
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

  # Dashboards imported from grafana.com, downloaded by an init container at
  # pod start; pinned by revision
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: storage
          orgId: 1
          folder: Storage
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/storage
        - name: network
          orgId: 1
          folder: Network
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/network
        - name: infrastructure
          orgId: 1
          folder: Infrastructure
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/infrastructure
  dashboards:
    storage:
      ceph-cluster:
        gnetId: 2842
        revision: 18
      ceph-osd:
        gnetId: 5336
        revision: 9
      ceph-pools:
        gnetId: 5342
        revision: 9
    network:
      cilium-agent:
        gnetId: 16611
        revision: 1
        datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
      cilium-operator:
        gnetId: 16612
        revision: 1
        datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
      hubble:
        gnetId: 16613
        revision: 1
        datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
      blackbox-exporter:
        gnetId: 7587
        revision: 3
        datasource:
          - name: DS_SIGNCL-PROMETHEUS
            value: Prometheus
    infrastructure:
      node-exporter-full:
        gnetId: 1860
        revision: 45
      cert-manager:
        gnetId: 11001
        revision: 1
      argocd:
        gnetId: 14584
        revision: 1
      cloudnative-pg:
        gnetId: 20417
        revision: 4
        datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
          - name: DS_EXPRESSION
            value: __expr__

  ingress:
    enabled: false

  route:
    main:
      enabled: true
      parentRefs:
        - name: main
          namespace: gateway
          sectionName: https
      hostnames:
        - grafana.meyeringh.org
  envFromSecret: grafana-secrets
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://monitoring-system-kube-pro-prometheus.monitoring-system:9090
          access: proxy
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki.loki:3100
          access: proxy
  grafana.ini:
    server:
      root_url: https://grafana.meyeringh.org
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      name: Dex
      client_id: grafana-sso
      client_secret: $__env{GRAFANA_SSO_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://dex.meyeringh.org/auth
      token_url: https://dex.meyeringh.org/token
      api_url: https://dex.meyeringh.org/userinfo
