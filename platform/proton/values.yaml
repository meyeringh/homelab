app-template:
  controllers:
    proton:
      strategy: Recreate # bridge holds a lock file on the RWO volume, no overlapping pods
      containers:
        app:
          image:
            repository: ghcr.io/videocurio/proton-mail-bridge
            tag: v3.24.2
          resources:
            requests:
              memory: 300Mi
            limits:
              memory: 1Gi # initial account sync spikes well above steady state
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 25
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 25
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 25
                periodSeconds: 10
                failureThreshold: 60
    # SMTP auth canary: fails when the bridge session expired and a re-login
    # is needed (see README); alerted on via PrometheusRule
    auth-check:
      type: cronjob
      cronjob:
        schedule: "*/30 * * * *"
        successfulJobsHistory: 1
        failedJobsHistory: 1
        ttlSecondsAfterFinished: 3600
        backoffLimit: 2
      containers:
        app:
          image:
            repository: python
            tag: 3.14-alpine
          command:
            - python3
            - -c
            - |
              import os, smtplib
              s = smtplib.SMTP("proton.proton.svc.cluster.local", 1025, timeout=30)
              s.ehlo()
              s.login(os.environ["username"], os.environ["password"])
              s.quit()
              print("smtp auth ok")
          envFrom:
            - secretRef:
                name: smtp-config-secret
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 64Mi
  service:
    app:
      controller: proton
      ports:
        smtp:
          port: 1025
          targetPort: 25
  persistence:
    state:
      enabled: true
      accessMode: ReadWriteOnce
      size: 5Gi
      retain: true
      advancedMounts:
        proton:
          app:
            - path: /root
              subPath: proton-state
