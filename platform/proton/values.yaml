app-template:
  controllers:
    proton:
      strategy: Recreate # bridge holds a lock file on the RWO volume, no overlapping pods
      containers:
        app:
          image:
            repository: ghcr.io/videocurio/proton-mail-bridge
            tag: v3.24.2
          resources:
            requests:
              memory: 300Mi
            limits:
              memory: 1Gi # initial account sync spikes well above steady state
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 25
                periodSeconds: 10
                failureThreshold: 3
            readiness:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 25
                periodSeconds: 10
            startup:
              enabled: true
              custom: true
              spec:
                tcpSocket:
                  port: 25
                periodSeconds: 10
                failureThreshold: 60
  service:
    app:
      controller: proton
      ports:
        smtp:
          port: 1025
          targetPort: 25
  persistence:
    state:
      enabled: true
      accessMode: ReadWriteOnce
      size: 5Gi
      retain: true
      advancedMounts:
        proton:
          app:
            - path: /root
              subPath: proton-state
